# MediaMan MPV config, included on every launch from the desktop app (SPEC §7.4 step 3, §11).
# The user's own mpv.conf still loads first; options here win where both set one.

# osc.lua replaces the built-in controller and draws its own seek bar, so MPV's OSD bar is off too.
osc=no
osd-bar=no

# The window closes when the file ends, so the desktop app can report the end and offer Up next.
keep-open=no
cursor-autohide=1000

# MPV's own messages (volume, track changes) in the SPEC §11 palette: text on the purple-tinted background.
osd-font-size=36
osd-color="#FFFFFF"
osd-border-color="#0E0B14"
osd-border-size=2
osd-shadow-offset=0
osd-margin-x=48
osd-margin-y=36

# Readable subtitles that stay clear of the controls.
sub-font-size=46
sub-border-size=2.5
sub-margin-y=48
