# MediaMan MPV config, included on every launch from the desktop app (SPEC §7.4 step 3, §11).
# The user's own mpv.conf still loads first; options here win where both set one.

# The built-in controller and OSD bar are set on the command line: off under the app's overlay, on in MPV's own window.

# MPV holds the last frame when the file ends, so the overlay can show Up next there; the desktop app closes it otherwise.
keep-open=yes
cursor-autohide=1000

# MPV's own messages (volume, track changes) in the SPEC §11 palette: text on the purple-tinted background.
osd-font-size=36
osd-color="#FFFFFF"
osd-border-color="#0E0B14"
osd-border-size=2
osd-shadow-offset=0
osd-margin-x=48
osd-margin-y=36

# Readable subtitles that stay clear of the controls.
sub-font-size=46
sub-border-size=2.5
sub-margin-y=48
