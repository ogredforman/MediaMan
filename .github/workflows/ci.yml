# Build, lint and test server, web and desktop on Windows and Linux (SPEC §12).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the full CI before publishing (PLAN 2.5.5).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Build
        run: npm run build

      # Generated code must match the contract: Orval output, and the route tree the build regenerates.
      - name: Check generated web code is up to date
        run: |
          npm run generate -w web
          git diff --exit-code -- web/src/api web/src/routeTree.gen.ts
        shell: bash

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
