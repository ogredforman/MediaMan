openapi: 3.1.0
info:
  title: MediaMan API
  version: 0.1.0
  summary: The contract between the MediaMan server and every client (SPEC §10.1).
  description: |
    Conventions shared by every operation:

    - **Auth:** every operation needs a bearer access token unless it overrides `security` with `[]`.
      Only setup, login (including token refresh), invite redemption and health are unauthenticated (SPEC §9).
      An operation whose `security` also lists `signedUrl` accepts a URL the server signed in place of a token, so
      `<img>` tags can load it; a signature that's invalid or expired counts as no token.
    - **Permissions:** every operation declares `x-permission`: `none` (unauthenticated),
      `authenticated` (any signed-in user) or a permission string from SPEC §8 (e.g. `library.view`).
      The server enforces it and a table-driven test covers every route (SPEC §12).
    - **Auth errors:** a request without a valid access token gets `401` with code `auth.required` (no token, or
      it's malformed, forged or expired: refresh, then sign in if that fails); a token whose session was revoked or
      whose user is disabled gets `401` `auth.session_expired` (sign in again); a signed-in user without the
      operation's permission gets `403` `auth.forbidden`.
    - **Local network only:** while remote access is off, every operation (health included) refuses clients
      outside the local network (loopback, private LAN, link-local and Tailscale ranges) and any request carrying
      forwarding headers (`Forwarded`, `X-Forwarded-For`, `X-Real-IP`, `CF-Connecting-IP`) with `403` code
      `remote_access.disabled`, before authentication (SPEC §7.12).
    - **First run:** until setup has created the Superadmin, every operation except `GET /health` and
      `POST /setup` returns `423` with code `setup.required`, before authentication (SPEC §7.1). Clients show the
      setup wizard when they see it.
    - **Errors:** every non-2xx response is `application/problem+json` with the `Problem` schema.
      `code` is stable and machine-readable; `action` tells the user what to do next (SPEC §11).
    - **Pagination:** list operations take the `limit` and `cursor` parameters and return their items
      alongside `PageInfo`. Pass `nextCursor` back as `cursor` to get the next page; it's absent on the last page.
      An invalid `cursor` or `limit` returns `400` with code `pagination.invalid`.
    - **Absent values:** an optional property with no value is omitted, never sent as `null`.
    - **Real-time updates:** `GET /events` is a Server-Sent Events stream. Each SSE frame's `event:` is the
      envelope `type`, `id:` is the envelope `id`, and `data:` is the `EventEnvelope` as JSON. The server also sends
      SSE comment lines (starting with `:`) when the stream opens and as keep-alives; clients ignore them.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check.
      tags: [system]
      security: []
      x-permission: none
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'

  /setup:
    post:
      operationId: completeSetup
      summary: "First-run setup: creates the Superadmin, records the mode and adds the first library (SPEC §7.1)."
      description: |
        One atomic step: either everything is created or nothing is. Unauthenticated, and only until it succeeds;
        after that it returns `409`. The response signs the new Superadmin in, as `POST /auth/login` would, and the
        first library's scan is queued. The mode takes effect when the server next starts.
      tags: [setup]
      security: []
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '200':
          description: Setup is complete and the Superadmin is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: |
            Some fields are invalid (`setup.invalid`). `errors` is keyed by field (`username`, `password`, `mode`,
            `library`, `library.path`, `library.contentType`) so the wizard can show each message inline.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Setup is already complete (`setup.complete`). Sign in instead.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /server/mode:
    put:
      operationId: setServerMode
      summary: "Records where the server listens; takes effect when the server restarts (SPEC §7.1 step 3, §8 setup)."
      tags: [setup]
      x-permission: server.control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerModeRequest'
      responses:
        '200':
          description: The mode is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerModeState'
        '400':
          description: The mode is missing or unknown (`bad_request`); `errors.mode` says why.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/login:
    post:
      operationId: login
      summary: Signs in with a username and password and starts a session (SPEC §7.11).
      description: |
        Returns a short-lived access token for the `Authorization: Bearer` header and a refresh token for
        `POST /auth/refresh`. Each sign-in is a session the user can later see and revoke.
      tags: [auth]
      security: []
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: |
            The username or password is wrong, or the account is disabled (`auth.invalid_credentials`). The response
            doesn't say which.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Exchanges a refresh token for a new access token and a new refresh token.
      description: |
        Part of signing in, so it's unauthenticated. The refresh token rotates: the one sent stops working and the
        response carries its replacement, valid for 30 days from now. Sending a refresh token that was already
        exchanged revokes its session, so a client must never refresh twice with the same token, even concurrently.
      tags: [auth]
      security: []
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The session continues with new tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: |
            The refresh token is unknown, expired or already used, its session was revoked, or the account is disabled
            (`auth.session_expired`). The user signs in again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      operationId: logout
      summary: Signs out the session the access token belongs to.
      description: |
        Revokes the token's session: its refresh token stops working and its access tokens are refused from now on,
        even before they expire. Other sessions of the same user stay signed in.
      tags: [auth]
      x-permission: authenticated
      responses:
        '204':
          description: Signed out.
        default:
          $ref: '#/components/responses/Problem'

  /auth/session/profile:
    put:
      operationId: selectSessionProfile
      summary: Picks the profile the signed-in session watches as.
      description: |
        The profile picker shows after sign-in (SPEC §7.11 step 3). The choice is recorded on the token's session, so
        it lasts across token refreshes and restarts until another profile is picked or the session signs out; a new
        sign-in starts with none picked. Profile-scoped data (watch state, resume, Home rows) follows the session's
        profile. Deleting the picked profile clears it.
      tags: [auth]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectProfileRequest'
      responses:
        '200':
          description: The profile is now the session's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          description: The account has no such profile (`profile.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /profiles:
    get:
      operationId: listProfiles
      summary: Lists the signed-in account's profiles, oldest first, and which one the session has picked.
      description: Every account has at least one profile; one created before profiles existed gets its default here.
      tags: [profiles]
      x-permission: authenticated
      responses:
        '200':
          description: The account's profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProfile
      summary: Adds a profile to the signed-in account.
      tags: [profiles]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: The new profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: A field is invalid (`profile.invalid`); `errors` is keyed by field (`name`, `avatar`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            Another profile of the account has the name, ignoring case (`profile.name_taken`), or the account already
            has 10 profiles (`profile.limit`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    patch:
      operationId: updateProfile
      summary: Renames a profile or changes its avatar. Omitted fields stay as they are.
      tags: [profiles]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: A field is invalid (`profile.invalid`); `errors` is keyed by field (`name`, `avatar`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The account has no such profile (`profile.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Another profile of the account has the name, ignoring case (`profile.name_taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProfile
      summary: Deletes a profile and its watch state.
      description: Sessions that had it picked go back to having none picked. An account always keeps one profile.
      tags: [profiles]
      x-permission: authenticated
      responses:
        '204':
          description: Deleted.
        '404':
          description: The account has no such profile (`profile.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: It's the account's only profile (`profile.last`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /events:
    get:
      operationId: getEvents
      summary: Server-Sent Events stream of real-time updates (scan progress, downloads, VPN status).
      tags: [system]
      x-permission: authenticated
      responses:
        '200':
          description: An open event stream. Each frame's data is an `EventEnvelope`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventEnvelope'
        default:
          $ref: '#/components/responses/Problem'

  /libraries:
    get:
      operationId: listLibraries
      summary: Lists the libraries, sorted by name.
      tags: [library]
      x-permission: library.view
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of libraries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryPage'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLibrary
      summary: Adds an External library of one or more folders and queues its first scan (SPEC §8 libraries).
      description: |
        Each root must be a full path to a folder the server can read. Roots can't overlap: a folder can't be inside,
        or contain, another root of this or any other library, or contain the server's data directory. MediaMan only
        reads an External library (SPEC §5). Managed libraries arrive in a later stage.
      tags: [library]
      x-permission: library.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryCreateRequest'
      responses:
        '201':
          description: The library is added and its first scan is queued when scanning is available.
          headers:
            Location:
              description: The new library's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          description: |
            Some fields are invalid (`library.invalid`). `errors` is keyed by field (`name`, `contentType`,
            `rootPaths`, `rootPaths[N]` for the Nth root from 0, `scanIntervalMinutes`) so each message can be shown inline.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /libraries/{libraryId}:
    get:
      operationId: getLibrary
      summary: Gets one library with its scan state.
      tags: [library]
      x-permission: library.view
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '200':
          description: The library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateLibrary
      summary: Renames a library or changes its content type, roots or scan interval.
      description: |
        Fields left out stay as they are. `rootPaths` replaces the whole list and follows the same rules as creating a
        library. Files under a removed root leave the library at once; nothing on disk is touched (SPEC §5). Adding a
        root queues a scan. Roots can't change while the library's scan is running (`409` `library.scan_running`).
      tags: [library]
      x-permission: library.manage
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryUpdateRequest'
      responses:
        '200':
          description: The library as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          description: Some fields are invalid (`library.invalid`); `errors` is keyed by field as for `createLibrary`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The library's scan is running (`library.scan_running`). Try again when it finishes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteLibrary
      summary: Removes a library and its files from MediaMan; nothing on disk is touched (SPEC §5).
      description: |
        Needs `server.control`, since the Admin preset can't delete libraries (SPEC §8 accounts). A queued scan is
        dropped; a running one makes this return `409` `library.scan_running`.
      tags: [library]
      x-permission: server.control
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '204':
          description: The library is removed.
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The library's scan is running (`library.scan_running`). Try again when it finishes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /libraries/{libraryId}/scan:
    post:
      operationId: startLibraryScan
      summary: Queues a scan of the library (scan, match, import) and returns at once.
      description: |
        A background worker scans the library's roots, matches new files against the metadata provider and imports
        the matches (SPEC §7.2). Libraries scan one at a time. Progress arrives on `GET /events` as `scan.progress`
        events whose `data` is a `ScanProgressEvent`. Asking again while the library's scan is queued or running
        changes nothing and returns the current state.
      tags: [library]
      x-permission: library.manage
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '202':
          description: The scan is queued or already running. The body is the library with its scan state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          description: Scanning isn't available because no metadata provider or media probe is configured (`scan.unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /libraries/{libraryId}/attention:
    get:
      operationId: listAttentionFiles
      summary: Lists the library's files that need attention, sorted by path.
      description: |
        Files the scan couldn't link on its own: unreadable files, files with no confident match (with their
        MatchReview candidates) and files whose episode the provider doesn't know (SPEC §7.2, §11 "Needs attention").
      tags: [library]
      x-permission: library.manage
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of files that need attention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionFilePage'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /titles:
    get:
      operationId: listTitles
      summary: Browses the movies and shows that have at least one matched file, sorted by name.
      tags: [library]
      x-permission: library.view
      parameters:
        - name: kind
          in: query
          required: false
          description: Only movies or only shows. Omit for both.
          schema:
            $ref: '#/components/schemas/TitleKind'
        - name: libraryId
          in: query
          required: false
          description: Only titles with a matched file in this library.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of titles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitlePage'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /titles/{titleId}:
    get:
      operationId: getTitle
      summary: A title's detail. A movie has its versions; a show has its seasons and episodes with their versions.
      tags: [library]
      x-permission: library.view
      parameters:
        - name: titleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleDetail'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /artwork/{artworkId}:
    get:
      operationId: getArtwork
      summary: A cached artwork image. Clients don't build this path; they load an `ArtworkRef.url` as-is.
      description: |
        The server caches each image the first time it's needed, normally during a scan, and records its dominant
        color (SPEC §8 metadata [M]). An image that isn't cached yet is fetched from the metadata provider first.
        The response is `image/jpeg`, `image/png`, `image/gif`, `image/webp`, `image/bmp` or `image/svg+xml`, and
        an id's image never changes, so clients may cache it indefinitely.
      tags: [library]
      x-permission: library.view
      security:
        - bearerAuth: []
        - signedUrl: []
      parameters:
        - name: artworkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exp
          in: query
          description: When the signed URL expires, in Unix seconds. Part of an `ArtworkRef.url`; clients never build it.
          schema:
            type: integer
            format: int64
        - name: sig
          in: query
          description: The URL's signature. Part of an `ArtworkRef.url`; clients never build it.
          schema:
            type: string
      responses:
        '200':
          description: The image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: The image doesn't exist (`artwork.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: |
            The image isn't cached and couldn't be fetched from the metadata provider (`artwork.unavailable`). It's
            fetched again on the next scan or request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: |
            Any other error, including `500` `artwork.cache_in_library` when the server's data directory is inside an
            External library, so nothing can be cached (SPEC §5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /dev/playables/{playableId}/play:
    post:
      operationId: devPlay
      summary: "Prototype only: launches MPV on the server's own host for one of the Playable's files."
      description: |
        Dev-only (`x-dev-only`, SPEC §8 playback [P], §13). The server maps it only in the dev configuration of a
        Debug build; everywhere else it returns `404`. It never ships, and it's removed when the desktop app plays
        through `POST /playback/sessions` and `IPlayer` (SPEC §7.4). The server picks the best available version:
        files that aren't `missing` first, then the highest resolution, then the largest.
      tags: [dev]
      x-permission: library.view
      x-dev-only: true
      parameters:
        - name: playableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: MPV was launched on the server's host with the chosen file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevPlayStarted'
        '404':
          description: |
            The Playable doesn't exist (`playable.not_found`), or the server isn't running the dev configuration
            (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: None of the Playable's files is available to play (`playback.no_file`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: MPV couldn't be started on the server's host (`playback.player_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from sign-in, signed with the per-install key (SPEC §7.11, §9).
    signedUrl:
      type: apiKey
      in: query
      name: sig
      description: |
        A signature (with its `exp` parameter) in a URL the server returned, made with the per-install key and not
        bound to a user (SPEC §9, ADR 0008). Only operations that list it accept it.

  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string

  responses:
    Problem:
      description: The request failed. The body says what happened and what to do next.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [healthy]
        version:
          type: string
          description: Server version.

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        deviceName:
          type: string
          maxLength: 100
          description: How the session is listed, e.g. `Living room PC`. Defaults to the client's User-Agent.

    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1

    AuthTokens:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: |
            A JWT for the `Authorization: Bearer` header, valid for 15 minutes.
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: |
            Opaque. Store it securely: it's a credential. It works once, until `refreshTokenExpiresAt`.
        refreshTokenExpiresAt:
          type: string
          format: date-time

    ServerMode:
      type: string
      description: |
        `local` listens on this computer only (loopback); `server` listens on the local network, every interface
        (SPEC §7.1 step 3). Either way, clients outside the local network are refused while remote access is off.
      enum: [local, server]

    SetupRequest:
      type: object
      required: [username, password, mode, library]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 12
        mode:
          $ref: '#/components/schemas/ServerMode'
        library:
          $ref: '#/components/schemas/SetupLibrary'
        deviceName:
          type: string
          maxLength: 100
          description: How the Superadmin's first session is listed. Defaults to the client's User-Agent.

    SetupLibrary:
      type: object
      description: The first library. It's an External library, so MediaMan only reads it (SPEC §5).
      required: [path, contentType]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          description: A full path to a folder the server can read, e.g. `D:\Movies` or `/mnt/media/movies`.
        contentType:
          $ref: '#/components/schemas/ContentType'
        name:
          type: string
          description: Defaults to the folder's name.

    ServerModeRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/ServerMode'

    ServerModeState:
      type: object
      required: [mode, restartRequired]
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/ServerMode'
        restartRequired:
          type: boolean
          description: True when the recorded mode differs from the one the server is running in.

    Problem:
      type: object
      description: An RFC 9457 problem details object with MediaMan extensions.
      required: [title, status, code]
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: Short, human-readable summary of what happened.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: The request path that produced the problem.
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          description: Stable machine-readable error code, e.g. `not_found` or `setup.required`.
        action:
          type: string
          description: The next action the user can take (SPEC §11 "no dead ends").
        traceId:
          type: string
          description: Correlates the problem with server logs.
        errors:
          type: object
          description: Validation errors keyed by field name.
          additionalProperties:
            type: array
            items:
              type: string

    ProfileAvatar:
      type: string
      description: A preset avatar, a colour clients render with the profile's initial.
      enum: [violet, blue, teal, green, amber, orange, rose, slate]

    Profile:
      type: object
      description: A Netflix-style viewer under an account (SPEC §6.1). Watch state belongs to a profile.
      required: [id, name, avatar]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 32
        avatar:
          $ref: '#/components/schemas/ProfileAvatar'

    ProfileList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Profile'
        activeProfileId:
          type: string
          format: uuid
          description: The profile the session has picked. Absent until one is picked; clients show the picker then.

    CreateProfileRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: 1 to 32 characters after trimming, unique within the account ignoring case.
        avatar:
          $ref: '#/components/schemas/ProfileAvatar'

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: 1 to 32 characters after trimming, unique within the account ignoring case.
        avatar:
          $ref: '#/components/schemas/ProfileAvatar'

    SelectProfileRequest:
      type: object
      required: [profileId]
      additionalProperties: false
      properties:
        profileId:
          type: string
          format: uuid

    PageInfo:
      type: object
      description: Paging state returned by every list operation, alongside its `items`.
      properties:
        nextCursor:
          type: string
          description: Cursor for the next page. Absent on the last page.

    EventEnvelope:
      type: object
      description: One real-time update. `data` depends on `type`.
      required: [id, type, at, data]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique, increasing event id; also the SSE `id:` field.
        type:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)*$'
          description: Event type, e.g. `scan.progress`; also the SSE `event:` field.
        at:
          type: string
          format: date-time
        data:
          description: Event payload; its shape is defined per event type.

    LibraryKind:
      type: string
      description: External libraries are only read; Managed libraries are where downloads are imported (SPEC §5).
      enum: [external, managed]

    ContentType:
      type: string
      enum: [movies, shows, anime, mixed]

    Library:
      type: object
      required: [id, name, kind, contentType, rootPaths, scanIntervalMinutes, scan]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/LibraryKind'
        contentType:
          $ref: '#/components/schemas/ContentType'
        rootPaths:
          type: array
          items:
            type: string
        scanIntervalMinutes:
          type: integer
          minimum: 0
        scan:
          $ref: '#/components/schemas/ScanState'

    LibraryCreateRequest:
      type: object
      required: [contentType, rootPaths]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          description: Defaults to the first root's folder name.
        contentType:
          $ref: '#/components/schemas/ContentType'
        rootPaths:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            description: A full path to a folder the server can read, e.g. `D:\Movies` or `/mnt/media/movies`.
        scanIntervalMinutes:
          type: integer
          description: Minutes between full scans, 15 to 10080 (a week), or 0 for none. Defaults to 360 (6 hours).

    LibraryUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        contentType:
          $ref: '#/components/schemas/ContentType'
        rootPaths:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
        scanIntervalMinutes:
          type: integer

    LibraryPage:
      type: object
      required: [items, pageInfo]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Library'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    ScanState:
      type: object
      description: |
        The library's scan right now. `phase` and `startedAt` are present while `running`. Scan state is kept in
        memory, so `lastScan` covers scans since the server started.
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [idle, queued, running]
        phase:
          type: string
          description: |
            Scanning finds and probes files, matching searches the provider, importing links the matches, and artwork
            caches their images and dominant colors.
          enum: [scanning, matching, importing, artwork]
        startedAt:
          type: string
          format: date-time
        lastScan:
          $ref: '#/components/schemas/ScanSummary'

    ScanSummary:
      type: object
      description: The most recent finished scan. A failed scan's counts cover the phases that finished.
      required: [startedAt, finishedAt, outcome, counts]
      additionalProperties: false
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [succeeded, failed]
        counts:
          $ref: '#/components/schemas/ScanCounts'
        error:
          $ref: '#/components/schemas/ScanError'

    ScanCounts:
      type: object
      required: [added, changed, unchanged, restored, missing, unreadable, purged, linked, needsAttention, deferred]
      additionalProperties: false
      properties:
        added:
          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        restored:
          type: integer
          minimum: 0
          description: Missing files that came back.
        missing:
          type: integer
          minimum: 0
        unreadable:
          type: integer
          minimum: 0
        purged:
          type: integer
          minimum: 0
          description: Files missing for longer than the 30-day retention, removed with their links.
        linked:
          type: integer
          minimum: 0
          description: Files matched and linked to their Playables.
        needsAttention:
          type: integer
          minimum: 0
          description: Files sent to review or otherwise left needing attention by matching and importing.
        deferred:
          type: integer
          minimum: 0
          description: Files left `pending` after provider errors; the next scan retries them.

    ScanError:
      type: object
      description: Why a scan failed. The server log has the details.
      required: [code, detail]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
        detail:
          type: string

    ScanProgressEvent:
      type: object
      description: The `data` of a `scan.progress` event, sent on every change to a library's scan state.
      required: [libraryId, scan]
      additionalProperties: false
      properties:
        libraryId:
          type: string
          format: uuid
        scan:
          $ref: '#/components/schemas/ScanState'

    AttentionFile:
      type: object
      description: A file the scan couldn't link on its own.
      required: [mediaFileId, path, fileName, reason]
      additionalProperties: false
      properties:
        mediaFileId:
          type: string
          format: uuid
        path:
          type: string
        fileName:
          type: string
          description: The file's name, without its folder.
        reason:
          type: string
          description: |
            Why it needs attention: `unreadable`, `no-match`, `low-confidence`, `ambiguous` or `episode-not-found`.
            New reasons may be added.
        parsed:
          $ref: '#/components/schemas/ParsedGuess'
        review:
          $ref: '#/components/schemas/MatchReview'

    AttentionFilePage:
      type: object
      required: [items, pageInfo]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttentionFile'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    ParsedGuess:
      type: object
      description: What the release parser read from the file name and its folders.
      required: [episodes]
      additionalProperties: false
      properties:
        title:
          type: string
        year:
          type: integer
        season:
          type: integer
        episodes:
          type: array
          items:
            type: integer
        absoluteEpisode:
          type: integer
        resolution:
          type: string
          enum: [720p, 1080p, 1440p, 2160p]
        source:
          type: string
        codec:
          type: string
        hdrFormat:
          type: string
        audio:
          type: string
        releaseGroup:
          type: string

    MatchReview:
      type: object
      description: A low-confidence or failed match awaiting a user (SPEC §7.3). `candidates` is best first and may be empty.
      required: [id, reason, candidates]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'

    MatchCandidate:
      type: object
      required: [titleRef, score]
      additionalProperties: false
      properties:
        titleRef:
          type: string
          description: The candidate's provider id as `provider:value`, e.g. `tmdb:movie/603` or `tmdb:tv/1396` (TMDB ids carry the kind, ADR 0006).
        score:
          type: number
          minimum: 0
          maximum: 1
        kind:
          $ref: '#/components/schemas/TitleKind'
        name:
          type: string
        year:
          type: integer
        posterUrl:
          type: string

    TitleKind:
      type: string
      enum: [movie, show]

    MediaFileStatus:
      type: string
      enum: [pending, matched, needsAttention, ignored, missing]

    ArtworkRef:
      type: object
      description: An image of a title, season or episode.
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          description: |
            Where the client loads the image, relative to the API base. Treat it as opaque and load it as-is: it
            carries a signature (`exp` and `sig`) so it loads without a bearer token. The URL stays the same for the
            whole UTC day and stays valid for at least a day after it's returned.
        dominantColor:
          type: string
          description: The image's dominant color as `#RRGGBB`, for tinting heroes (SPEC §11).

    ExternalIds:
      type: object
      description: The title's ids at metadata providers. Any may be absent.
      additionalProperties: false
      properties:
        tmdb:
          type: string
          description: The TMDB id with its kind, `movie/603` or `tv/1396` (ADR 0006).
        imdb:
          type: string
        tvdb:
          type: string
        anilist:
          type: string

    TitleSummary:
      type: object
      required: [id, kind, name, genres]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TitleKind'
        name:
          type: string
        year:
          type: integer
        rating:
          type: number
          description: Provider rating, 0 to 10.
        genres:
          type: array
          items:
            type: string
        poster:
          $ref: '#/components/schemas/ArtworkRef'

    TitlePage:
      type: object
      required: [items, pageInfo]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TitleSummary'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    TitleDetail:
      type: object
      description: A title with everything the detail page shows. `playable` is set for movies, `seasons` for shows.
      required: [id, kind, name, genres, externalIds]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TitleKind'
        name:
          type: string
        year:
          type: integer
        rating:
          type: number
        genres:
          type: array
          items:
            type: string
        poster:
          $ref: '#/components/schemas/ArtworkRef'
        overview:
          type: string
        runtimeMinutes:
          type: integer
        externalIds:
          $ref: '#/components/schemas/ExternalIds'
        backdrop:
          $ref: '#/components/schemas/ArtworkRef'
        logo:
          $ref: '#/components/schemas/ArtworkRef'
        playable:
          $ref: '#/components/schemas/MoviePlayable'
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/Season'

    MoviePlayable:
      type: object
      required: [id, versions]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The Playable to start playback of.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/MediaVersion'

    Season:
      type: object
      required: [id, number, episodes]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 0
          description: Season number; 0 holds specials.
        name:
          type: string
        overview:
          type: string
        poster:
          $ref: '#/components/schemas/ArtworkRef'
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/Episode'

    Episode:
      type: object
      description: One episode. `playableId` is absent and `versions` is empty when no file holds it.
      required: [id, number, versions]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        absoluteNumber:
          type: integer
        name:
          type: string
        overview:
          type: string
        airDate:
          type: string
          format: date
        still:
          $ref: '#/components/schemas/ArtworkRef'
        playableId:
          type: string
          format: uuid
        versions:
          type: array
          items:
            $ref: '#/components/schemas/MediaVersion'

    DevPlayStarted:
      type: object
      description: The file MPV was launched with (dev-only, see `devPlay`).
      required: [mediaFileId, fileName]
      additionalProperties: false
      properties:
        mediaFileId:
          type: string
          format: uuid
        fileName:
          type: string
          description: The file's name, without its folder.

    MediaVersion:
      type: object
      description: |
        One file holding a Playable. A multi-episode file is a version of each episode it holds, with `part`
        counting from 1. A `missing` file keeps its version for 30 days in case its drive comes back (SPEC §7.2).
      required: [mediaFileId, fileName, sizeBytes, status, part]
      additionalProperties: false
      properties:
        mediaFileId:
          type: string
          format: uuid
        fileName:
          type: string
          description: The file's name, without its folder.
        sizeBytes:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/MediaFileStatus'
        part:
          type: integer
          minimum: 1
        container:
          type: string
        durationSeconds:
          type: number
          minimum: 0
        width:
          type: integer
        height:
          type: integer
        videoCodec:
          type: string
        hdrFormat:
          type: string
          description: e.g. `HDR10`, `HLG`, `Dolby Vision`. Absent for SDR.
        audioCodec:
          type: string
        audioChannels:
          type: integer
        source:
          type: string
          description: Release source parsed from the name, e.g. `BluRay`, `WEB-DL`.
        releaseGroup:
          type: string
