openapi: 3.1.0
info:
  title: MediaMan API
  version: 0.1.0
  summary: The contract between the MediaMan server and every client (SPEC §10.1).
  description: |
    Conventions shared by every operation:

    - **Auth:** every operation needs a bearer access token unless it overrides `security` with `[]`.
      Only setup, login (including token refresh), invite redemption and health are unauthenticated (SPEC §9).
      An operation whose `security` also lists `signedUrl` accepts a URL the server signed in place of a token, so
      `<img>` tags can load it; a signature that's invalid or expired counts as no token. An operation that lists
      `sessionUrl` accepts a URL signed for one session instead, so a player can load it; it counts as that
      session's token.
    - **Permissions:** every operation declares `x-permission`: `none` (unauthenticated),
      `authenticated` (any signed-in user) or a permission string from SPEC §8 (e.g. `library.view`).
      The server enforces it and a table-driven test covers every route (SPEC §12).
    - **Auth errors:** a request without a valid access token gets `401` with code `auth.required` (no token, or
      it's malformed, forged or expired: refresh, then sign in if that fails); a token whose session was revoked or
      whose user is disabled gets `401` `auth.session_expired` (sign in again); a signed-in user without the
      operation's permission gets `403` `auth.forbidden`.
    - **Local network only:** while remote access is off, every operation (health included) refuses clients
      outside the local network (loopback, private LAN, link-local and Tailscale ranges) and any request carrying
      forwarding headers (`Forwarded`, `X-Forwarded-For`, `X-Real-IP`, `CF-Connecting-IP`) with `403` code
      `remote_access.disabled`, before authentication (SPEC §7.12).
    - **First run:** until setup has created the Superadmin, every operation except `GET /health` and
      `POST /setup` returns `423` with code `setup.required`, before authentication (SPEC §7.1). Clients show the
      setup wizard when they see it.
    - **Errors:** every non-2xx response is `application/problem+json` with the `Problem` schema.
      `code` is stable and machine-readable; `action` tells the user what to do next (SPEC §11).
    - **Pagination:** list operations take the `limit` and `cursor` parameters and return their items
      alongside `PageInfo`. Pass `nextCursor` back as `cursor` to get the next page; it's absent on the last page.
      An invalid `cursor` or `limit` returns `400` with code `pagination.invalid`.
    - **Absent values:** an optional property with no value is omitted, never sent as `null`.
    - **Real-time updates:** `GET /events` is a Server-Sent Events stream. Each SSE frame's `event:` is the
      envelope `type`, `id:` is the envelope `id`, and `data:` is the `EventEnvelope` as JSON. The server also sends
      SSE comment lines (starting with `:`) when the stream opens and as keep-alives; clients ignore them.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check.
      tags: [system]
      security: []
      x-permission: none
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'

  /setup:
    post:
      operationId: completeSetup
      summary: "First-run setup: creates the Superadmin, records the mode and adds the first library (SPEC §7.1)."
      description: |
        One atomic step: either everything is created or nothing is. Unauthenticated, and only until it succeeds;
        after that it returns `409`. The response signs the new Superadmin in, as `POST /auth/login` would, and the
        first library's scan is queued. The mode takes effect when the server next starts.
      tags: [setup]
      security: []
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '200':
          description: Setup is complete and the Superadmin is signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: |
            Some fields are invalid (`setup.invalid`). `errors` is keyed by field (`username`, `password`, `mode`,
            `library`, `library.path`, `library.contentType`) so the wizard can show each message inline.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Setup is already complete (`setup.complete`). Sign in instead.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /server/mode:
    get:
      operationId: getServerMode
      summary: The recorded mode and whether the server must restart to use it (SPEC §8 setup, §11 Settings).
      tags: [setup]
      x-permission: server.control
      responses:
        '200':
          description: The recorded mode, or the one the server runs in if setup hasn't recorded one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerModeState'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: setServerMode
      summary: "Records where the server listens; takes effect when the server restarts (SPEC §7.1 step 3, §8 setup)."
      tags: [setup]
      x-permission: server.control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerModeRequest'
      responses:
        '200':
          description: The mode is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerModeState'
        '400':
          description: The mode is missing or unknown (`bad_request`); `errors.mode` says why.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /settings/metadata:
    get:
      operationId: getMetadataSettings
      summary: Where the TMDB access token in use comes from (SPEC §8 metadata, §11 Settings). The token is never returned.
      tags: [settings]
      x-permission: settings.manage
      responses:
        '200':
          description: The metadata settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataSettings'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: setMetadataSettings
      summary: Sets or clears the TMDB access token that overrides the shipped one; the next TMDB request uses it.
      description: |
        The token is stored encrypted with the per-install key and is never logged or returned (SPEC §9). An empty
        `tmdbAccessToken` clears the override, so the configured or shipped token is used again.
      tags: [settings]
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataSettingsRequest'
      responses:
        '200':
          description: The token is saved, or the override is cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataSettings'
        '400':
          description: >-
            The value can't be a TMDB read-access token (`bad_request`), e.g. it contains spaces or it's the short v3
            API key; `errors.tmdbAccessToken` says why.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/login:
    post:
      operationId: login
      summary: Signs in with a username and password and starts a session (SPEC §7.11).
      description: |
        Returns a short-lived access token for the `Authorization: Bearer` header and a refresh token for
        `POST /auth/refresh`. Each sign-in is a session the user can later see and revoke.
      tags: [auth]
      security: []
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: |
            The username or password is wrong, or the account is disabled (`auth.invalid_credentials`). The response
            doesn't say which.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/refresh:
    post:
      operationId: refreshTokens
      summary: Exchanges a refresh token for a new access token and a new refresh token.
      description: |
        Part of signing in, so it's unauthenticated. The refresh token rotates: the one sent stops working and the
        response carries its replacement, valid for 30 days from now. Sending a refresh token that was already
        exchanged revokes its session, so a client must never refresh twice with the same token, even concurrently.
      tags: [auth]
      security: []
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: The session continues with new tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: |
            The refresh token is unknown, expired or already used, its session was revoked, or the account is disabled
            (`auth.session_expired`). The user signs in again.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      operationId: logout
      summary: Signs out the session the access token belongs to.
      description: |
        Revokes the token's session: its refresh token stops working and its access tokens are refused from now on,
        even before they expire. Other sessions of the same user stay signed in.
      tags: [auth]
      x-permission: authenticated
      responses:
        '204':
          description: Signed out.
        default:
          $ref: '#/components/responses/Problem'

  /auth/session/profile:
    put:
      operationId: selectSessionProfile
      summary: Picks the profile the signed-in session watches as.
      description: |
        The profile picker shows after sign-in (SPEC §7.11 step 3). The choice is recorded on the token's session, so
        it lasts across token refreshes and restarts until another profile is picked or the session signs out; a new
        sign-in starts with none picked. Profile-scoped data (watch state, resume, Home rows) follows the session's
        profile. Deleting the picked profile clears it.
      tags: [auth]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectProfileRequest'
      responses:
        '200':
          description: The profile is now the session's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          description: The account has no such profile (`profile.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /account:
    get:
      operationId: getAccount
      summary: The signed-in account and the permissions its role grants (SPEC §7.11, §11 Settings).
      description: |
        Clients use `permissions` to hide what the user can't use; the server still enforces every permission on
        every operation (SPEC §5). The Superadmin holds every permission.
      tags: [auth]
      x-permission: authenticated
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          $ref: '#/components/responses/Problem'

  /profiles:
    get:
      operationId: listProfiles
      summary: Lists the signed-in account's profiles, oldest first, and which one the session has picked.
      description: Every account has at least one profile; one created before profiles existed gets its default here.
      tags: [profiles]
      x-permission: authenticated
      responses:
        '200':
          description: The account's profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createProfile
      summary: Adds a profile to the signed-in account.
      tags: [profiles]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: The new profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: A field is invalid (`profile.invalid`); `errors` is keyed by field (`name`, `avatar`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            Another profile of the account has the name, ignoring case (`profile.name_taken`), or the account already
            has 10 profiles (`profile.limit`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    patch:
      operationId: updateProfile
      summary: Renames a profile or changes its avatar or language preferences. Omitted fields stay as they are.
      tags: [profiles]
      x-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: A field is invalid (`profile.invalid`); `errors` is keyed by field (`name`, `avatar`, `audioLanguages`,
            `subtitleLanguages`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The account has no such profile (`profile.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Another profile of the account has the name, ignoring case (`profile.name_taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteProfile
      summary: Deletes a profile and its watch state.
      description: Sessions that had it picked go back to having none picked. An account always keeps one profile.
      tags: [profiles]
      x-permission: authenticated
      responses:
        '204':
          description: Deleted.
        '404':
          description: The account has no such profile (`profile.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: It's the account's only profile (`profile.last`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /events:
    get:
      operationId: getEvents
      summary: Server-Sent Events stream of real-time updates (scan progress, downloads, VPN status).
      tags: [system]
      x-permission: authenticated
      responses:
        '200':
          description: An open event stream. Each frame's data is an `EventEnvelope`.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventEnvelope'
        default:
          $ref: '#/components/responses/Problem'

  /libraries:
    get:
      operationId: listLibraries
      summary: Lists the libraries, sorted by name.
      tags: [library]
      x-permission: library.view
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of libraries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryPage'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createLibrary
      summary: Adds an External library of one or more folders and queues its first scan (SPEC §8 libraries).
      description: |
        Each root must be a full path to a folder the server can read. Roots can't overlap: a folder can't be inside,
        or contain, another root of this or any other library, or contain the server's data directory. MediaMan only
        reads an External library (SPEC §5). Managed libraries arrive in a later stage.
      tags: [library]
      x-permission: library.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryCreateRequest'
      responses:
        '201':
          description: The library is added and its first scan is queued when scanning is available.
          headers:
            Location:
              description: The new library's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          description: |
            Some fields are invalid (`library.invalid`). `errors` is keyed by field (`name`, `contentType`,
            `rootPaths`, `rootPaths[N]` for the Nth root from 0, `scanIntervalMinutes`) so each message can be shown inline.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /libraries/{libraryId}:
    get:
      operationId: getLibrary
      summary: Gets one library with its scan state.
      tags: [library]
      x-permission: library.view
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '200':
          description: The library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateLibrary
      summary: Renames a library or changes its content type, roots or scan interval.
      description: |
        Fields left out stay as they are. `rootPaths` replaces the whole list and follows the same rules as creating a
        library. Files under a removed root leave the library at once; nothing on disk is touched (SPEC §5). Adding a
        root queues a scan. Roots can't change while the library's scan is running (`409` `library.scan_running`).
      tags: [library]
      x-permission: library.manage
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryUpdateRequest'
      responses:
        '200':
          description: The library as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '400':
          description: Some fields are invalid (`library.invalid`); `errors` is keyed by field as for `createLibrary`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The library's scan is running (`library.scan_running`). Try again when it finishes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteLibrary
      summary: Removes a library and its files from MediaMan; nothing on disk is touched (SPEC §5).
      description: |
        Needs `server.control`, since the Admin preset can't delete libraries (SPEC §8 accounts). A queued scan is
        dropped; a running one makes this return `409` `library.scan_running`.
      tags: [library]
      x-permission: server.control
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '204':
          description: The library is removed.
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: The library's scan is running (`library.scan_running`). Try again when it finishes.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /libraries/{libraryId}/scan:
    post:
      operationId: startLibraryScan
      summary: Queues a scan of the library (scan, match, import) and returns at once.
      description: |
        A background worker scans the library's roots, matches new files against the metadata provider and imports
        the matches (SPEC §7.2). Libraries scan one at a time. Progress arrives on `GET /events` as `scan.progress`
        events whose `data` is a `ScanProgressEvent`. Asking again while the library's scan is queued or running
        changes nothing and returns the current state.
      tags: [library]
      x-permission: library.manage
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '202':
          description: The scan is queued or already running. The body is the library with its scan state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          description: Scanning isn't available because no metadata provider or media probe is configured (`scan.unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /libraries/{libraryId}/attention:
    get:
      operationId: listAttentionFiles
      summary: Lists the library's files that need attention, sorted by path.
      description: |
        Files the scan couldn't link on its own: unreadable files, files with no confident match (with their
        MatchReview candidates) and files whose episode the provider doesn't know (SPEC §7.2, §11 "Needs attention").
      tags: [library]
      x-permission: library.manage
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of files that need attention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttentionFilePage'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /catalog/search:
    get:
      operationId: searchCatalog
      summary: Searches the metadata provider's catalog by name, for "Fix match" (SPEC §7.3 step 2).
      description: |
        Results come from the configured metadata provider, best first, at most 20. They aren't limited to titles in
        the library; pick one and send its `titleRef` to `PUT /media-files/{mediaFileId}/match`.
      tags: [library]
      x-permission: library.manage
      parameters:
        - name: query
          in: query
          required: true
          description: The title's name, or part of it.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: year
          in: query
          required: false
          description: The release year; it ranks results, it doesn't filter them.
          schema:
            type: integer
            minimum: 1870
            maximum: 2200
        - name: kind
          in: query
          required: false
          description: Only movies or only shows; both when absent.
          schema:
            $ref: '#/components/schemas/TitleKind'
      responses:
        '200':
          description: The matching titles, best first; `items` may be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResult'
        '400':
          description: The query is empty or too long, or `year` or `kind` is invalid (`catalog.invalid`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The metadata provider didn't answer (`metadata.unavailable`); search again in a moment.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /media-files/{mediaFileId}/match:
    put:
      operationId: relinkMediaFile
      summary: Links a file to the title the user picked and remembers the choice for its path (SPEC §7.3 step 3).
      description: |
        Replaces the file's links with the chosen title (and, for a show, the season and episodes), marks it matched
        and removes its MatchReview. The choice is recorded as an override for the file's path, so rescans keep it
        even when the file changes or comes back after being missing. Works on files that need attention and on
        files already matched ("Fix match" on any title). Only the database changes; files on disk are never touched.
        For a show, leave `season` and `episodes` out to use what the file name says.
      tags: [library]
      x-permission: library.manage
      parameters:
        - $ref: '#/components/parameters/MediaFileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaFileMatchRequest'
      responses:
        '200':
          description: The file is linked to the chosen title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaFileMatch'
        '400':
          description: |
            The choice is invalid (`match.invalid`). `errors` is keyed by field (`titleRef`, `season`, `episodes`):
            an unknown title, a season or episodes for a movie, or a show with no episode mapping.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The file doesn't exist (`media_file.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The file is missing, ignored or unreadable (`match.file_unavailable`), or its library is being scanned
            (`library.scan_running`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The provider doesn't list the chosen season or episode for this show (`match.episode_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The metadata provider didn't answer (`metadata.unavailable`); nothing changed, try again in a moment.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /genres:
    get:
      operationId: listGenres
      summary: The genres of the library's movies and shows, with how many titles each has, most titles first (SPEC §11).
      description: |
        Only titles with a matched file count, as in `listTitles`, and a title counts once per genre. Ties sort by name.
        Not paged: a library has a few dozen genres at most.
      tags: [library]
      x-permission: library.view
      parameters:
        - name: kind
          in: query
          required: false
          description: Only movies' or only shows' genres. Omit for both.
          schema:
            $ref: '#/components/schemas/TitleKind'
      responses:
        '200':
          description: The genres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreList'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /home:
    get:
      operationId: getHome
      summary: The Home screen for the session's profile, the hero pick and its rows (SPEC §8 browsing, §11 Home).
      description: |
        Only titles with a matched file count, as in `listTitles`. Rows come in display order (Continue Watching, Next
        Up, Recently Added, then genres), and a row with no items is left out. Without a picked profile the personal
        rows (Continue Watching and Next Up) are left out and the hero's Play starts from the beginning.
      tags: [library]
      x-permission: library.view
      responses:
        '200':
          description: The Home screen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
        default:
          $ref: '#/components/responses/Problem'

  /search:
    get:
      operationId: searchLibrary
      summary: Instant search across the library's movies and shows, best matches first (SPEC §8 browsing, §11 Search).
      description: |
        Only titles with a matched file count, as in `listTitles`. Matching ignores case, accents and punctuation, so
        "amelie" finds "Amélie" and "spider man" finds "Spider-Man". An exact name ranks first, then names that start
        with the query, then names where every query word starts a word, then names that contain the query; ties sort
        by name, then year. A blank query returns no titles.
      tags: [library]
      x-permission: library.view
      parameters:
        - name: q
          in: query
          required: true
          description: What the user typed.
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          description: Maximum number of titles to return.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: The matching titles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySearchResults'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /titles:
    get:
      operationId: listTitles
      summary: Browses the movies and shows that have at least one matched file, sorted by name or by rating.
      tags: [library]
      x-permission: library.view
      parameters:
        - name: kind
          in: query
          required: false
          description: Only movies or only shows. Omit for both.
          schema:
            $ref: '#/components/schemas/TitleKind'
        - name: libraryId
          in: query
          required: false
          description: Only titles with a matched file in this library.
          schema:
            type: string
            format: uuid
        - name: genre
          in: query
          required: false
          description: Only titles with this genre, matched exactly (a name from `listGenres`). Blank or omitted for all.
          schema:
            type: string
            maxLength: 200
        - name: sort
          in: query
          required: false
          description: |
            `name`: by name, then year. `rating`: highest rated first (unrated last), then by name and year.
          schema:
            $ref: '#/components/schemas/TitleSort'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of titles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitlePage'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /titles/{titleId}:
    get:
      operationId: getTitle
      summary: A title's detail. A movie has its versions; a show has its seasons and episodes with their versions.
      tags: [library]
      x-permission: library.view
      parameters:
        - name: titleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleDetail'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /titles/{titleId}/preferred-version:
    parameters:
      - name: titleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setPreferredVersion
      summary: Remembers which version the session's profile wants to play for this title (SPEC §7.4 step 2, §8 parsing).
      description: |
        Records the chosen file and its quality (resolution and HDR format) for the session's profile. A movie plays
        that file while it's available. A show plays, for each episode, the best version with the same resolution and
        HDR format, so one pick carries across the whole show. When nothing matches, the highest quality plays.
        Other profiles keep their own choice.
      tags: [library]
      x-permission: library.view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferredVersionRequest'
      responses:
        '204':
          description: The preference is saved.
        '400':
          description: The file isn't an available version of this title (`version.invalid`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The title doesn't exist (`title.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The session hasn't picked a profile yet (`profile.required`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: clearPreferredVersion
      summary: Forgets the profile's preferred version for this title, so the highest quality plays again.
      tags: [library]
      x-permission: library.view
      responses:
        '204':
          description: The preference is cleared, or there was none.
        '404':
          description: The title doesn't exist (`title.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The session hasn't picked a profile yet (`profile.required`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /artwork/{artworkId}:
    get:
      operationId: getArtwork
      summary: A cached artwork image. Clients don't build this path; they load an `ArtworkRef.url` as-is.
      description: |
        The server caches each image the first time it's needed, normally during a scan, and records its dominant
        color (SPEC §8 metadata [M]). An image that isn't cached yet is fetched from the metadata provider first.
        The response is `image/jpeg`, `image/png`, `image/gif`, `image/webp`, `image/bmp` or `image/svg+xml`, and
        an id's image never changes, so clients may cache it indefinitely.
      tags: [library]
      x-permission: library.view
      security:
        - bearerAuth: []
        - signedUrl: []
      parameters:
        - name: artworkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exp
          in: query
          description: When the signed URL expires, in Unix seconds. Part of an `ArtworkRef.url`; clients never build it.
          schema:
            type: integer
            format: int64
        - name: sig
          in: query
          description: The URL's signature. Part of an `ArtworkRef.url`; clients never build it.
          schema:
            type: string
      responses:
        '200':
          description: The image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: The image doesn't exist (`artwork.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: |
            The image isn't cached and couldn't be fetched from the metadata provider (`artwork.unavailable`). It's
            fetched again on the next scan or request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: |
            Any other error, including `500` `artwork.cache_in_library` when the server's data directory is inside an
            External library, so nothing can be cached (SPEC §5).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /playback/sessions:
    post:
      operationId: createPlaybackSession
      summary: Starts playing a Playable on this client (SPEC §7.4, §7.5).
      description: |
        The client sends its capabilities and the server decides how it plays. `player: mpv` decodes everything, so
        it gets a direct stream of the chosen version: the profile's preferred version if it applies, otherwise the
        highest quality (SPEC §7.4 step 2). Browser playback (direct play, remux or transcode to HLS, SPEC §7.5) is
        decided from the same request in a later release; until then a browser gets `501`.

        The response carries the resume position when the profile stopped part-way (after 2 minutes and before 90%)
        and the external subtitle files next to the chosen version. Its URLs are signed for the session that asked
        (`sessionUrl`), so players load them without a token.
      tags: [playback]
      x-permission: library.view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaybackSessionRequest'
      responses:
        '200':
          description: How to play it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
        '400':
          description: The request is malformed, e.g. an unknown `player` (`playback.invalid`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The Playable doesn't exist (`playable.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The session hasn't picked a profile yet (`profile.required`), or none of the Playable's files is
            available to play (`playback.no_file`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '501':
          description: The server can't play to this kind of player yet (`playback.player_unsupported`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /media-files/{mediaFileId}/stream:
    get:
      operationId: streamMediaFile
      summary: The file's bytes, as-is. Clients don't build this path; they load a `PlaybackSession.url`.
      description: |
        A direct stream with HTTP range support, so players can seek (`206 Partial Content`), served as `video/*` (or
        `application/octet-stream` for an unknown extension). Only files that hold a Playable and are on disk are
        served. The file is only read, never changed (SPEC §5).
      tags: [playback]
      x-permission: library.view
      security:
        - bearerAuth: []
        - sessionUrl: []
      parameters:
        - $ref: '#/components/parameters/MediaFileId'
        - $ref: '#/components/parameters/SessionUrlSession'
        - $ref: '#/components/parameters/SessionUrlExpires'
        - $ref: '#/components/parameters/SessionUrlSignature'
        - name: Range
          in: header
          description: A byte range, e.g. `bytes=0-1023`.
          schema:
            type: string
      responses:
        '200':
          description: The whole file.
          content:
            video/*:
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range.
          content:
            video/*:
              schema:
                type: string
                format: binary
        '404':
          description: The file doesn't exist, holds no Playable or isn't on disk (`media_file.unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '416':
          description: The requested range is outside the file.
        default:
          $ref: '#/components/responses/Problem'

  /media-files/{mediaFileId}/subtitles/{subtitleId}:
    get:
      operationId: getSubtitle
      summary: An external subtitle file next to a media file. Clients load a `SubtitleTrack.url` as-is.
      description: |
        Served only while it's still next to the media file. The file is only read, never changed (SPEC §5).
        The response is `application/x-subrip`, `text/vtt` or `text/x-ssa`.
      tags: [playback]
      x-permission: library.view
      security:
        - bearerAuth: []
        - sessionUrl: []
      parameters:
        - $ref: '#/components/parameters/MediaFileId'
        - name: subtitleId
          in: path
          required: true
          description: The subtitle's id, part of a `SubtitleTrack.url`.
          schema:
            type: string
        - $ref: '#/components/parameters/SessionUrlSession'
        - $ref: '#/components/parameters/SessionUrlExpires'
        - $ref: '#/components/parameters/SessionUrlSignature'
      responses:
        '200':
          description: The subtitle file.
          content:
            application/x-subrip:
              schema:
                type: string
            text/*:
              schema:
                type: string
        '404':
          description: The media file or the subtitle isn't there any more (`subtitle.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /playables/{playableId}/progress:
    put:
      operationId: reportWatchProgress
      summary: Records how far the session's profile got in a Playable (SPEC §7.4 steps 4–5).
      description: |
        Players report every 10 seconds and on pause, seek and quit. Progress is kept per profile and Playable, so it
        needs no playback session and survives server restarts; the next `POST /playback/sessions` resumes from it.
        At 90% or more the Playable is marked watched, and it stays watched when later reports go back.

        For an episode the response names the next episode with a file to play: the next one in its season, else the
        first one of the next season that isn't specials. Clients use it for "Up next" once `watched` is set.
      tags: [playback]
      x-permission: library.view
      parameters:
        - $ref: '#/components/parameters/PlayableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchProgressReport'
      responses:
        '200':
          description: The progress as recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchProgress'
        '400':
          description: The position or duration is negative or missing (`progress.invalid`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The Playable doesn't exist (`playable.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The session hasn't picked a profile yet (`profile.required`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /playables/{playableId}/watched:
    put:
      operationId: setPlayableWatched
      summary: Marks a movie or an episode watched or unwatched for the session's profile (SPEC §8 browsing).
      description: |
        Marking watched sets `watched` and drops any resume position, as if the profile had just finished it, so it
        counts for Next Up. Marking unwatched clears the profile's progress on it: it starts fresh and leaves Continue
        Watching and Next Up. Other profiles keep their own state.
      tags: [playback]
      x-permission: library.view
      parameters:
        - $ref: '#/components/parameters/PlayableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchedRequest'
      responses:
        '204':
          description: The watched state is saved.
        '400':
          description: '`watched` is missing (`watched.invalid`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The Playable doesn't exist (`playable.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The session hasn't picked a profile yet (`profile.required`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /titles/{titleId}/watched:
    parameters:
      - name: titleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setTitleWatched
      summary: Marks a whole movie or show, or one season of a show, watched or unwatched for the session's profile (SPEC §8 browsing).
      description: |
        Applies `setPlayableWatched` to every Playable of the title, or of one season when `seasonNumber` is given.
        Episodes marked watched together count as watched in season and episode order, so Next Up offers the episode
        after the last one marked.
      tags: [playback]
      x-permission: library.view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TitleWatchedRequest'
      responses:
        '204':
          description: The watched state is saved.
        '400':
          description: '`watched` is missing or `seasonNumber` is negative (`watched.invalid`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The title doesn't exist (`title.not_found`), or it has no season with that number (`season.not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The session hasn't picked a profile yet (`profile.required`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from sign-in, signed with the per-install key (SPEC §7.11, §9).
    signedUrl:
      type: apiKey
      in: query
      name: sig
      description: |
        A signature (with its `exp` parameter) in a URL the server returned, made with the per-install key and not
        bound to a user (SPEC §9, ADR 0008). Only operations that list it accept it.
    sessionUrl:
      type: apiKey
      in: query
      name: sig
      description: |
        A signature (with its `sid` and `exp` parameters) in a URL the server returned, bound to the session that
        asked for it (SPEC §7.4, ADR 0008). It stands in for that session's token for 12 hours, so players such as
        MPV load it without one. It stops working when the session is revoked or the user is disabled, and the user
        still needs the operation's permission.

  parameters:
    SessionUrlSession:
      name: sid
      in: query
      description: The session a `sessionUrl` is signed for. Part of a URL the server returned; clients never build it.
      schema:
        type: string
    SessionUrlExpires:
      name: exp
      in: query
      description: When a `sessionUrl` expires, in Unix seconds. Part of a URL the server returned; clients never build it.
      schema:
        type: integer
        format: int64
    SessionUrlSignature:
      name: sig
      in: query
      description: A `sessionUrl`'s signature. Part of a URL the server returned; clients never build it.
      schema:
        type: string
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaFileId:
      name: mediaFileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlayableId:
      name: playableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string

  responses:
    Problem:
      description: The request failed. The body says what happened and what to do next.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [healthy]
        version:
          type: string
          description: Server version.

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        deviceName:
          type: string
          maxLength: 100
          description: How the session is listed, e.g. `Living room PC`. Defaults to the client's User-Agent.

    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1

    Permission:
      type: string
      description: A permission from SPEC §8. Roles hold these; every operation declares the one it needs.
      enum:
        - library.view
        - library.manage
        - metadata.edit
        - downloads.request
        - downloads.create
        - downloads.approve
        - downloads.manage
        - indexers.manage
        - users.manage
        - roles.manage
        - settings.manage
        - server.control

    Account:
      type: object
      required: [id, username, isSuperadmin, permissions]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        isSuperadmin:
          type: boolean
          description: True for the install's owner, who holds every permission (SPEC §7.11).
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'

    AuthTokens:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: |
            A JWT for the `Authorization: Bearer` header, valid for 15 minutes.
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: |
            Opaque. Store it securely: it's a credential. It works once, until `refreshTokenExpiresAt`.
        refreshTokenExpiresAt:
          type: string
          format: date-time

    ServerMode:
      type: string
      description: |
        `local` listens on this computer only (loopback); `server` listens on the local network, every interface
        (SPEC §7.1 step 3). Either way, clients outside the local network are refused while remote access is off.
      enum: [local, server]

    SetupRequest:
      type: object
      required: [username, password, mode, library]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 12
        mode:
          $ref: '#/components/schemas/ServerMode'
        library:
          $ref: '#/components/schemas/SetupLibrary'
        deviceName:
          type: string
          maxLength: 100
          description: How the Superadmin's first session is listed. Defaults to the client's User-Agent.

    SetupLibrary:
      type: object
      description: The first library. It's an External library, so MediaMan only reads it (SPEC §5).
      required: [path, contentType]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          description: A full path to a folder the server can read, e.g. `D:\Movies` or `/mnt/media/movies`.
        contentType:
          $ref: '#/components/schemas/ContentType'
        name:
          type: string
          description: Defaults to the folder's name.

    ServerModeRequest:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/ServerMode'

    ServerModeState:
      type: object
      required: [mode, restartRequired]
      additionalProperties: false
      properties:
        mode:
          $ref: '#/components/schemas/ServerMode'
        restartRequired:
          type: boolean
          description: True when the recorded mode differs from the one the server is running in.

    MetadataSettingsRequest:
      type: object
      required: [tmdbAccessToken]
      additionalProperties: false
      properties:
        tmdbAccessToken:
          type: string
          maxLength: 1000
          description: A TMDB API Read Access Token, or an empty string to clear the override.

    MetadataSettings:
      type: object
      required: [tmdbAccessTokenSource]
      additionalProperties: false
      properties:
        tmdbAccessTokenSource:
          type: string
          enum: [shipped, configuration, settings]
          description: >-
            Where the TMDB token in use comes from: the one shipped with MediaMan, the server configuration
            (`MediaMan:Metadata:Tmdb:AccessToken`), or the override set in Settings.

    Problem:
      type: object
      description: An RFC 9457 problem details object with MediaMan extensions.
      required: [title, status, code]
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: Short, human-readable summary of what happened.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: The request path that produced the problem.
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          description: Stable machine-readable error code, e.g. `not_found` or `setup.required`.
        action:
          type: string
          description: The next action the user can take (SPEC §11 "no dead ends").
        traceId:
          type: string
          description: Correlates the problem with server logs.
        errors:
          type: object
          description: Validation errors keyed by field name.
          additionalProperties:
            type: array
            items:
              type: string

    ProfileAvatar:
      type: string
      description: A preset avatar, a colour clients render with the profile's initial.
      enum: [violet, blue, teal, green, amber, orange, rose, slate]

    LanguageCode:
      type: string
      description: |
        An ISO 639-1 code from the languages a profile can prefer (SPEC §8 playback). Players match it against the 2-
        and 3-letter tags media uses (`de`, `ger`, `deu`).
      enum: [ar, bg, bn, ca, cs, da, de, el, en, es, et, eu, fa, fi, fr, gl, he, hi, hr, hu, id, is, it, ja, ko, lt, lv, ms, nl, no, pl, pt, ro, ru, sk, sl, sr, sv, ta, te, th, tl, tr, uk, vi, zh]

    LanguagePreferences:
      type: array
      description: Languages in order of preference, most preferred first. At most 5, no repeats; empty means no preference.
      maxItems: 5
      uniqueItems: true
      items:
        $ref: '#/components/schemas/LanguageCode'

    Profile:
      type: object
      description: A Netflix-style viewer under an account (SPEC §6.1). Watch state belongs to a profile.
      required: [id, name, avatar, audioLanguages, subtitleLanguages]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 32
        avatar:
          $ref: '#/components/schemas/ProfileAvatar'
        audioLanguages:
          $ref: '#/components/schemas/LanguagePreferences'
        subtitleLanguages:
          $ref: '#/components/schemas/LanguagePreferences'

    ProfileList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Profile'
        activeProfileId:
          type: string
          format: uuid
          description: The profile the session has picked. Absent until one is picked; clients show the picker then.

    CreateProfileRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          description: 1 to 32 characters after trimming, unique within the account ignoring case.
        avatar:
          $ref: '#/components/schemas/ProfileAvatar'

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: 1 to 32 characters after trimming, unique within the account ignoring case.
        avatar:
          $ref: '#/components/schemas/ProfileAvatar'
        audioLanguages:
          $ref: '#/components/schemas/LanguagePreferences'
        subtitleLanguages:
          $ref: '#/components/schemas/LanguagePreferences'

    SelectProfileRequest:
      type: object
      required: [profileId]
      additionalProperties: false
      properties:
        profileId:
          type: string
          format: uuid

    PageInfo:
      type: object
      description: Paging state returned by every list operation, alongside its `items`.
      properties:
        nextCursor:
          type: string
          description: Cursor for the next page. Absent on the last page.

    EventEnvelope:
      type: object
      description: One real-time update. `data` depends on `type`.
      required: [id, type, at, data]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique, increasing event id; also the SSE `id:` field.
        type:
          type: string
          pattern: '^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)*$'
          description: Event type, e.g. `scan.progress`; also the SSE `event:` field.
        at:
          type: string
          format: date-time
        data:
          description: Event payload; its shape is defined per event type.

    LibraryKind:
      type: string
      description: External libraries are only read; Managed libraries are where downloads are imported (SPEC §5).
      enum: [external, managed]

    ContentType:
      type: string
      enum: [movies, shows, anime, mixed]

    Library:
      type: object
      required: [id, name, kind, contentType, rootPaths, scanIntervalMinutes, scan]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/LibraryKind'
        contentType:
          $ref: '#/components/schemas/ContentType'
        rootPaths:
          type: array
          items:
            type: string
        scanIntervalMinutes:
          type: integer
          minimum: 0
        scan:
          $ref: '#/components/schemas/ScanState'

    LibraryCreateRequest:
      type: object
      required: [contentType, rootPaths]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          description: Defaults to the first root's folder name.
        contentType:
          $ref: '#/components/schemas/ContentType'
        rootPaths:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            description: A full path to a folder the server can read, e.g. `D:\Movies` or `/mnt/media/movies`.
        scanIntervalMinutes:
          type: integer
          description: Minutes between full scans, 15 to 10080 (a week), or 0 for none. Defaults to 360 (6 hours).

    LibraryUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        contentType:
          $ref: '#/components/schemas/ContentType'
        rootPaths:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
        scanIntervalMinutes:
          type: integer

    LibraryPage:
      type: object
      required: [items, pageInfo]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Library'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    ScanState:
      type: object
      description: |
        The library's scan right now. `phase` and `startedAt` are present while `running`. Scan state is kept in
        memory, so `lastScan` covers scans since the server started.
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [idle, queued, running]
        phase:
          type: string
          description: |
            Scanning finds and probes files, matching searches the provider, importing links the matches, and artwork
            caches their images and dominant colors.
          enum: [scanning, matching, importing, artwork]
        startedAt:
          type: string
          format: date-time
        lastScan:
          $ref: '#/components/schemas/ScanSummary'

    ScanSummary:
      type: object
      description: The most recent finished scan. A failed scan's counts cover the phases that finished.
      required: [startedAt, finishedAt, outcome, counts]
      additionalProperties: false
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [succeeded, failed]
        counts:
          $ref: '#/components/schemas/ScanCounts'
        error:
          $ref: '#/components/schemas/ScanError'

    ScanCounts:
      type: object
      required: [added, changed, unchanged, restored, missing, unreadable, purged, linked, needsAttention, deferred]
      additionalProperties: false
      properties:
        added:
          type: integer
          minimum: 0
        changed:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        restored:
          type: integer
          minimum: 0
          description: Missing files that came back.
        missing:
          type: integer
          minimum: 0
        unreadable:
          type: integer
          minimum: 0
        purged:
          type: integer
          minimum: 0
          description: Files missing for longer than the 30-day retention, removed with their links.
        linked:
          type: integer
          minimum: 0
          description: Files matched and linked to their Playables.
        needsAttention:
          type: integer
          minimum: 0
          description: Files sent to review or otherwise left needing attention by matching and importing.
        deferred:
          type: integer
          minimum: 0
          description: Files left `pending` after provider errors; the next scan retries them.

    ScanError:
      type: object
      description: Why a scan failed. The server log has the details.
      required: [code, detail]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
        detail:
          type: string

    ScanProgressEvent:
      type: object
      description: The `data` of a `scan.progress` event, sent on every change to a library's scan state.
      required: [libraryId, scan]
      additionalProperties: false
      properties:
        libraryId:
          type: string
          format: uuid
        scan:
          $ref: '#/components/schemas/ScanState'

    AttentionFile:
      type: object
      description: A file the scan couldn't link on its own.
      required: [mediaFileId, path, fileName, reason]
      additionalProperties: false
      properties:
        mediaFileId:
          type: string
          format: uuid
        path:
          type: string
        fileName:
          type: string
          description: The file's name, without its folder.
        reason:
          type: string
          description: |
            Why it needs attention: `unreadable`, `no-match`, `low-confidence`, `ambiguous` or `episode-not-found`.
            New reasons may be added.
        parsed:
          $ref: '#/components/schemas/ParsedGuess'
        review:
          $ref: '#/components/schemas/MatchReview'

    AttentionFilePage:
      type: object
      required: [items, pageInfo]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttentionFile'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    ParsedGuess:
      type: object
      description: What the release parser read from the file name and its folders.
      required: [episodes]
      additionalProperties: false
      properties:
        title:
          type: string
        year:
          type: integer
        season:
          type: integer
        episodes:
          type: array
          items:
            type: integer
        absoluteEpisode:
          type: integer
        resolution:
          type: string
          enum: [720p, 1080p, 1440p, 2160p]
        source:
          type: string
        codec:
          type: string
        hdrFormat:
          type: string
        audio:
          type: string
        releaseGroup:
          type: string

    MatchReview:
      type: object
      description: A low-confidence or failed match awaiting a user (SPEC §7.3). `candidates` is best first and may be empty.
      required: [id, reason, candidates]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'

    MatchCandidate:
      type: object
      required: [titleRef, score]
      additionalProperties: false
      properties:
        titleRef:
          type: string
          description: The candidate's provider id as `provider:value`, e.g. `tmdb:movie/603` or `tmdb:tv/1396` (TMDB ids carry the kind, ADR 0006).
        score:
          type: number
          minimum: 0
          maximum: 1
        kind:
          $ref: '#/components/schemas/TitleKind'
        name:
          type: string
        year:
          type: integer
        posterUrl:
          type: string

    CatalogSearchResult:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCandidate'

    CatalogCandidate:
      type: object
      description: A title in the metadata provider's catalog.
      required: [titleRef, kind, name]
      additionalProperties: false
      properties:
        titleRef:
          type: string
          description: The title's provider id as `provider:value`, e.g. `tmdb:movie/603` (ADR 0006).
        kind:
          $ref: '#/components/schemas/TitleKind'
        name:
          type: string
        year:
          type: integer
        overview:
          type: string
        posterUrl:
          type: string

    MediaFileMatchRequest:
      type: object
      required: [titleRef]
      additionalProperties: false
      properties:
        titleRef:
          type: string
          description: The chosen title's provider id, from a MatchReview candidate or a catalog search.
        season:
          type: integer
          minimum: 0
          description: For a show, the season holding `episodes` (0 for specials). Required with `episodes`.
        episodes:
          type: array
          description: For a show, the episodes the file holds, in order (several for a multi-episode file).
          items:
            type: integer
            minimum: 1

    MediaFileMatch:
      type: object
      required: [mediaFileId, titleId, status]
      additionalProperties: false
      properties:
        mediaFileId:
          type: string
          format: uuid
        titleId:
          type: string
          format: uuid
          description: The title the file now belongs to, for opening its detail page.
        status:
          $ref: '#/components/schemas/MediaFileStatus'

    TitleKind:
      type: string
      enum: [movie, show]

    MediaFileStatus:
      type: string
      enum: [pending, matched, needsAttention, ignored, missing]

    ArtworkRef:
      type: object
      description: An image of a title, season or episode.
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          description: |
            Where the client loads the image, relative to the API base. Treat it as opaque and load it as-is: it
            carries a signature (`exp` and `sig`) so it loads without a bearer token. The URL stays the same for the
            whole UTC day and stays valid for at least a day after it's returned.
        dominantColor:
          type: string
          description: The image's dominant color as `#RRGGBB`, for tinting heroes (SPEC §11).

    ExternalIds:
      type: object
      description: The title's ids at metadata providers. Any may be absent.
      additionalProperties: false
      properties:
        tmdb:
          type: string
          description: The TMDB id with its kind, `movie/603` or `tv/1396` (ADR 0006).
        imdb:
          type: string
        tvdb:
          type: string
        anilist:
          type: string

    TitleSummary:
      type: object
      required: [id, kind, name, genres, watched]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TitleKind'
        name:
          type: string
        year:
          type: integer
        rating:
          type: number
          description: Provider rating, 0 to 10.
        genres:
          type: array
          items:
            type: string
        poster:
          $ref: '#/components/schemas/ArtworkRef'
        watched:
          type: boolean
          description: |
            The session's profile watched it: a movie's Playable, or every episode with a file outside specials (all of
            them when a show has only specials). False without a picked profile.

    LibrarySearchResults:
      type: object
      required: [query, titles]
      additionalProperties: false
      properties:
        query:
          type: string
          description: The query as received, so a client can drop answers to queries it has moved past.
        titles:
          type: array
          items:
            $ref: '#/components/schemas/TitleSummary'

    TitlePage:
      type: object
      required: [items, pageInfo]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TitleSummary'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    TitleSort:
      type: string
      enum: [name, rating]
      default: name

    GenreList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GenreCount'

    GenreCount:
      type: object
      required: [name, titleCount]
      additionalProperties: false
      properties:
        name:
          type: string
        titleCount:
          type: integer
          minimum: 1

    Home:
      type: object
      required: [rows]
      additionalProperties: false
      properties:
        hero:
          $ref: '#/components/schemas/HomeHero'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/HomeRow'

    HomeHero:
      type: object
      description: |
        The title the banner features: one of the ten most recently added titles with a backdrop, changing once a UTC
        day. Absent when no title has a backdrop.
      required: [title]
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/TitleSummary'
        overview:
          type: string
        backdrop:
          $ref: '#/components/schemas/ArtworkRef'
        logo:
          $ref: '#/components/schemas/ArtworkRef'
        playableId:
          type: string
          format: uuid
          description: |
            What Play starts. For a show, the episode the profile is part-way through, else its next episode, else the
            first episode of the first season (specials last). Absent when nothing can play.
        episode:
          $ref: '#/components/schemas/HomeEpisode'
        resumeSeconds:
          type: number
          minimum: 0
          description: Where the profile stopped in `playableId`, when resume is offered (as on `MoviePlayable`).

    HomeRowKind:
      type: string
      enum: [continueWatching, nextUp, recentlyAdded, genre]

    HomeRow:
      type: object
      description: |
        One row of at most 20 items. `continueWatching`: titles the profile is part-way through, most recent first.
        `nextUp`: the next episode of each show whose last-watched episode was finished, most recent first.
        `recentlyAdded`: titles by when their newest file was found. `genre`: the genre's titles by rating; there are at
        most 6 genre rows, for the genres with the most titles (at least 3).
      required: [kind, items]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/HomeRowKind'
        genre:
          type: string
          description: The genre, on `genre` rows only.
        items:
          type: array
          items:
            $ref: '#/components/schemas/HomeItem'

    HomeItem:
      type: object
      description: A card. `playableId` is set on Continue Watching and Next Up items, and `episode` when it's an episode.
      required: [title]
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/TitleSummary'
        playableId:
          type: string
          format: uuid
        episode:
          $ref: '#/components/schemas/HomeEpisode'
        progress:
          $ref: '#/components/schemas/HomeProgress'

    HomeEpisode:
      type: object
      required: [seasonNumber, number]
      additionalProperties: false
      properties:
        seasonNumber:
          type: integer
          minimum: 0
        number:
          type: integer
        name:
          type: string
        still:
          $ref: '#/components/schemas/ArtworkRef'

    HomeProgress:
      type: object
      description: How far the profile got, on Continue Watching items whose duration is known.
      required: [positionSeconds, durationSeconds]
      additionalProperties: false
      properties:
        positionSeconds:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          exclusiveMinimum: 0

    TitleDetail:
      type: object
      description: A title with everything the detail page shows. `playable` is set for movies, `seasons` and `showPlay` for shows.
      required: [id, kind, name, genres, externalIds]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TitleKind'
        name:
          type: string
        year:
          type: integer
        rating:
          type: number
        genres:
          type: array
          items:
            type: string
        poster:
          $ref: '#/components/schemas/ArtworkRef'
        overview:
          type: string
        runtimeMinutes:
          type: integer
        externalIds:
          $ref: '#/components/schemas/ExternalIds'
        backdrop:
          $ref: '#/components/schemas/ArtworkRef'
        logo:
          $ref: '#/components/schemas/ArtworkRef'
        playable:
          $ref: '#/components/schemas/MoviePlayable'
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/Season'
        versionPreference:
          $ref: '#/components/schemas/VersionPreference'
        showPlay:
          $ref: '#/components/schemas/ShowPlay'

    ShowPlay:
      type: object
      description: |
        What a show's Play starts for the session's profile, picked as `HomeHero.playableId`: the episode the profile is
        part-way through, else its next episode, else the first episode of the first season (specials last). Without a
        picked profile, the first episode with no resume. Set on shows only; absent when no episode has a file.
      required: [playableId, episode]
      additionalProperties: false
      properties:
        playableId:
          type: string
          format: uuid
        episode:
          $ref: '#/components/schemas/HomeEpisode'
        resumeSeconds:
          type: number
          minimum: 0
          description: Where the profile stopped in `playableId`, when resume is offered (as on `HomeHero`).

    VersionPreference:
      type: object
      description: |
        The session's profile's preferred version of this title (`setPreferredVersion`). Absent when the profile
        hasn't picked one, so the highest quality plays.
      additionalProperties: false
      properties:
        mediaFileId:
          type: string
          format: uuid
          description: The file picked. Absent once that file is gone; its quality still applies.
        resolution:
          type: string
          description: The picked file's resolution, e.g. `2160p`, `1080p`. Absent when it couldn't be told.
        hdrFormat:
          type: string
          description: The picked file's HDR format, e.g. `HDR10`. Absent for SDR.

    PreferredVersionRequest:
      type: object
      required: [mediaFileId]
      additionalProperties: false
      properties:
        mediaFileId:
          type: string
          format: uuid
          description: A version of one of this title's Playables that isn't missing.

    MoviePlayable:
      type: object
      required: [id, versions, watched]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The Playable to start playback of.
        versions:
          type: array
          items:
            $ref: '#/components/schemas/MediaVersion'
        selectedMediaFileId:
          type: string
          format: uuid
          description: |
            The version Play uses for the session's profile: its preferred version if it applies, otherwise the
            highest quality (SPEC §7.4 step 2). Absent when no version can play.
        resumeSeconds:
          type: number
          minimum: 0
          description: |
            Where the session's profile stopped, when resume is offered (after 2 minutes and before 90%), as in
            `PlaybackSession.resumeSeconds`. Absent otherwise, and without a picked profile.
        watched:
          type: boolean
          description: The session's profile reached 90% at some point (`WatchProgress.watched`). False without a picked profile.

    Season:
      type: object
      required: [id, number, episodes]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 0
          description: Season number; 0 holds specials.
        name:
          type: string
        overview:
          type: string
        poster:
          $ref: '#/components/schemas/ArtworkRef'
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/Episode'

    Episode:
      type: object
      description: One episode. `playableId` is absent and `versions` is empty when no file holds it.
      required: [id, number, versions, watched]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        absoluteNumber:
          type: integer
        name:
          type: string
        overview:
          type: string
        airDate:
          type: string
          format: date
        still:
          $ref: '#/components/schemas/ArtworkRef'
        playableId:
          type: string
          format: uuid
        versions:
          type: array
          items:
            $ref: '#/components/schemas/MediaVersion'
        selectedMediaFileId:
          type: string
          format: uuid
          description: The version Play uses for the session's profile, as on `MoviePlayable`. Absent when no version can play.
        resumeSeconds:
          type: number
          minimum: 0
          description: As on `MoviePlayable`.
        watched:
          type: boolean
          description: As on `MoviePlayable`; false when no file holds the episode.

    CreatePlaybackSessionRequest:
      type: object
      required: [playableId, capabilities]
      additionalProperties: false
      properties:
        playableId:
          type: string
          format: uuid
        capabilities:
          $ref: '#/components/schemas/ClientCapabilities'

    ClientCapabilities:
      type: object
      description: |
        What the client can play (SPEC §7.4, §7.5). MPV decodes everything, so it sends only `player`. A browser lists
        what it supports, and the server direct plays, remuxes or transcodes to fit.
      required: [player]
      additionalProperties: false
      properties:
        player:
          type: string
          enum: [mpv, browser]
        containers:
          type: array
          description: e.g. `mp4`, `webm`, `matroska`.
          items:
            type: string
        videoCodecs:
          type: array
          description: e.g. `h264`, `hevc`, `av1`.
          items:
            type: string
        audioCodecs:
          type: array
          description: e.g. `aac`, `opus`, `eac3`.
          items:
            type: string
        hdrFormats:
          type: array
          description: HDR formats the display can show, named as in `MediaVersion.hdrFormat`. Empty or absent means SDR only.
          items:
            type: string
        maxBitrate:
          type: integer
          format: int64
          minimum: 1
          description: The most the client can take, in bits per second. Absent means no limit.
        subtitleFormats:
          type: array
          description: e.g. `srt`, `vtt`, `ass`, `pgs`.
          items:
            type: string

    PlaybackSession:
      type: object
      description: How the client plays a Playable.
      required: [playableId, mediaFileId, method, url, title, subtitles, audioLanguages, subtitleLanguages]
      additionalProperties: false
      properties:
        playableId:
          type: string
          format: uuid
        mediaFileId:
          type: string
          format: uuid
          description: The version that plays.
        method:
          type: string
          enum: [directStream, hls]
          description: |
            `directStream` is the file as-is with range support; `hls` is an HLS playlist (a browser remux or
            transcode, not produced yet).
        url:
          type: string
          description: |
            What the player loads, relative to the server. Signed for the requesting session (`sessionUrl`), so it
            needs no token. It expires after 12 hours; a client whose load fails asks for a new session.
        title:
          type: string
          description: A display title for the player, e.g. `Alien (1979)` or `The Office S01E02 · Diversity Day`.
        resumeSeconds:
          type: number
          minimum: 0
          description: Where the profile stopped, when resume is offered (after 2 minutes and before 90%). Absent otherwise.
        durationSeconds:
          type: number
          minimum: 0
          description: The version's runtime, when known.
        subtitles:
          type: array
          description: External subtitle files next to the version. Subtitles inside the file aren't listed.
          items:
            $ref: '#/components/schemas/SubtitleTrack'
        audioLanguages:
          type: array
          description: |
            The profile's audio languages as the tags media may carry, in preference order: each preferred code
            followed by its ISO 639-2 forms (`de` gives `de`, `ger`, `deu`). Empty when the profile has none.
          items:
            type: string
        subtitleLanguages:
          type: array
          description: The profile's subtitle languages, as tags in preference order like `audioLanguages`.
          items:
            type: string
        previousEpisode:
          $ref: '#/components/schemas/NextEpisode'
        nextEpisode:
          $ref: '#/components/schemas/NextEpisode'

    SubtitleTrack:
      type: object
      description: An external subtitle file.
      required: [url, format, fileName, forced]
      additionalProperties: false
      properties:
        url:
          type: string
          description: Signed like `PlaybackSession.url`.
        format:
          type: string
          enum: [srt, vtt, ass, ssa]
        fileName:
          type: string
          description: The file's name, without its folder.
        language:
          type: string
          description: The language tag from the file name, e.g. `en` in `Alien.en.srt`. Absent when the name has none.
        forced:
          type: boolean
          description: The name marks it as forced (only foreign-language parts are subtitled).

    WatchedRequest:
      type: object
      required: [watched]
      additionalProperties: false
      properties:
        watched:
          type: boolean
          description: True marks it watched; false clears the profile's progress on it.

    TitleWatchedRequest:
      type: object
      required: [watched]
      additionalProperties: false
      properties:
        watched:
          type: boolean
          description: As in `WatchedRequest`.
        seasonNumber:
          type: integer
          minimum: 0
          description: Only this season of a show; 0 holds specials. Absent for the whole title.

    WatchProgressReport:
      type: object
      description: Where the player is in a Playable.
      required: [positionSeconds, durationSeconds]
      additionalProperties: false
      properties:
        positionSeconds:
          type: number
          minimum: 0
          description: The playback position. A position past the end counts as the end.
        durationSeconds:
          type: number
          minimum: 0
          description: The runtime the player sees; `0` when it doesn't know it, which keeps the one reported earlier.

    WatchProgress:
      type: object
      description: A profile's progress on a Playable, as recorded.
      required: [playableId, positionSeconds, durationSeconds, watched]
      additionalProperties: false
      properties:
        playableId:
          type: string
          format: uuid
        positionSeconds:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0
        watched:
          type: boolean
          description: Reached 90% at some point. It stays set when later reports go back.
        nextEpisode:
          $ref: '#/components/schemas/NextEpisode'

    NextEpisode:
      type: object
      description: |
        An episode next to the one playing that has a file to play, absent for a movie. `nextEpisode` (on
        `WatchProgress` and `PlaybackSession`) is the one after it, absent after the last episode;
        `PlaybackSession.previousEpisode` is the one before it: the previous number in its season, else the last
        episode of an earlier season that isn't specials, absent for the first episode. The player offers them as
        Previous and Next episode, and the next one as Up next.
      required: [playableId, seasonNumber, episodeNumber, title]
      additionalProperties: false
      properties:
        playableId:
          type: string
          format: uuid
        seasonNumber:
          type: integer
          minimum: 0
        episodeNumber:
          type: integer
          minimum: 0
        title:
          type: string
          description: A display title, like `PlaybackSession.title`, e.g. `The Office S01E03 · Health Care`.

    MediaVersion:
      type: object
      description: |
        One file holding a Playable. A multi-episode file is a version of each episode it holds, with `part`
        counting from 1. A `missing` file keeps its version for 30 days in case its drive comes back (SPEC §7.2).
      required: [mediaFileId, fileName, sizeBytes, status, part]
      additionalProperties: false
      properties:
        mediaFileId:
          type: string
          format: uuid
        fileName:
          type: string
          description: The file's name, without its folder.
        sizeBytes:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/MediaFileStatus'
        part:
          type: integer
          minimum: 1
        container:
          type: string
        durationSeconds:
          type: number
          minimum: 0
        width:
          type: integer
        height:
          type: integer
        videoCodec:
          type: string
        hdrFormat:
          type: string
          description: e.g. `HDR10`, `HLG`, `Dolby Vision`. Absent for SDR.
        audioCodec:
          type: string
        audioChannels:
          type: integer
        source:
          type: string
          description: Release source parsed from the name, e.g. `BluRay`, `WEB-DL`.
        releaseGroup:
          type: string
